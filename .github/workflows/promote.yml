# Promotion: reviewed migrations, then immutable client builds, to staging or production (story 1.8).
#
# Manual only, from main only. Jobs, ordered by `needs`:
#   checks (all CI checks, clean checkout) -> preflight (no environment: main only, migration
#   policy vs origin/main, production environment must exist with required reviewers and an
#   environment-scoped SUPABASE_PROJECT_REF) -> [production: staging-precondition, staging in
#   sync] -> promote (environment-protected: target/secret guards -> drift check -> migrations,
#   backend first -> marker + gate verification -> sealed client build + bundle scan -> verified
#   artifact upload -> optional static-host deploy of exactly that verified artifact).
# Owner steps: docs/runbooks/environments-and-promotion.md.

name: promote

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to promote to
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: promote-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  checks:
    name: all CI checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Fail-closed guards that run WITHOUT an environment, so a missing environment is never
  # auto-created unprotected and repository-level variables are visible on their own.
  preflight:
    name: preflight (main only, migration policy vs main, production protection)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      TARGET: ${{ inputs.target }}
      # Without an environment these resolve to repository/organization-level values only.
      REPO_LEVEL_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Promotion runs only from main (staging and production)
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Promotion must run from main (got $GITHUB_REF)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrations are ordered, immutable and non-destructive relative to origin/main
        run: node tools/ci/check-migrations.mjs --base origin/main
      - name: Production environment exists with a required-reviewer rule
        if: inputs.target == 'production'
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/production" > env.json; then
            echo "::error::GitHub environment 'production' does not exist or cannot be read; create it with Required reviewers (docs/runbooks/environments-and-promotion.md, owner step A2)"
            exit 1
          fi
          if ! node -e '
            const e = require("./env.json");
            const r = (e.protection_rules || []).find((p) => p.type === "required_reviewers");
            process.exit(r && (r.reviewers || []).length > 0 ? 0 : 1);
          '; then
            echo "::error::GitHub environment 'production' has no required-reviewer protection rule (owner step A2)"
            exit 1
          fi
          echo "production environment is protected by required reviewers"
      - name: Production project ref is environment-scoped only
        if: inputs.target == 'production'
        run: |
          if [ -n "$REPO_LEVEL_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF is defined at repository/organization level; delete it there and set it only on the 'production' environment (owner step A2)"
            exit 1
          fi

  staging-precondition:
    name: staging already carries this commit's migrations
    if: inputs.target == 'production'
    needs: [checks, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Staging is in sync with this commit (no pending, no drift)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::staging SUPABASE_ACCESS_TOKEN is not set; promote staging first (owner step in docs/runbooks/environments-and-promotion.md)"
            exit 1
          fi
          node tools/ci/check-migration-drift.mjs --env staging --require-synced

  promote:
    name: promote ${{ inputs.target }}
    needs: [checks, preflight, staging-precondition]
    # staging-precondition is skipped for staging; it must have succeeded for production.
    if: >-
      always() && needs.checks.result == 'success' && needs.preflight.result == 'success' &&
      (inputs.target == 'staging' || needs.staging-precondition.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Protection rules (required reviewer for production) are configured on this environment.
    environment: ${{ inputs.target }}
    env:
      TARGET: ${{ inputs.target }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      PROJECT_REF_VAR: ${{ vars.SUPABASE_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Supabase CLI
        run: npm ci

      - name: Resolve and guard the target project
        id: target
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Promotion must run from main"; exit 1
          fi
          if [ "$TARGET" = "production" ] && [ -z "$PROJECT_REF_VAR" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not set on the 'production' environment (owner step A2)"; exit 1
          fi
          if [ "$TARGET" = "staging" ]; then
            ref=$(node tools/env/environments.mjs get staging supabase.project_ref)
          else
            ref="$PROJECT_REF_VAR"
          fi
          # Refuses a ref that belongs to another environment or does not match this one.
          node tools/env/environments.mjs target "$TARGET" "$ref" > target.json
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "api_url=$(node -p 'require("./target.json").apiUrl')" >> "$GITHUB_OUTPUT"
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD(secret)"
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing SUPABASE_PUBLISHABLE_KEY(variable)"
          if [ -n "$missing" ]; then
            echo "::error::GitHub environment '$TARGET' is missing:$missing (owner step in docs/runbooks/environments-and-promotion.md)"
            exit 1
          fi
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "::error::SUPABASE_PUBLISHABLE_KEY must be a publishable key (sb_publishable_...), never a secret/service key"; exit 1 ;;
          esac

      - name: Hosted migration history has not drifted
        run: node tools/ci/check-migration-drift.mjs --env "$TARGET" --project-ref "${{ steps.target.outputs.ref }}"

      - name: Target database is unmarked or already marked as this environment
        run: node tools/ci/hosted-sql.mjs precheck "$TARGET" "${{ steps.target.outputs.ref }}"

      - name: Link the project
        run: npx supabase link --project-ref "${{ steps.target.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations to apply (dry run)
        run: npx supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      # Backend before clients. No --include-all: out-of-order versions are refused, and the
      # policy job has already rejected destructive or edited migrations.
      - name: Apply reviewed migrations
        run: npx supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Hosted history now equals the repository
        run: node tools/ci/check-migration-drift.mjs --env "$TARGET" --project-ref "${{ steps.target.outputs.ref }}" --require-synced

      - name: Environment marker set once, then marker and closed gates verified
        run: |
          node tools/ci/hosted-sql.mjs ensure-marker "$TARGET" "${{ steps.target.outputs.ref }}" "github:${{ github.actor }} run ${{ github.run_id }}"
          node tools/ci/hosted-sql.mjs verify "$TARGET" "${{ steps.target.outputs.ref }}"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Build the staff web client for this environment (once per commit)
        working-directory: apps/staff
        run: |
          flutter --version | grep -q 'Flutter 3.47.6'
          flutter pub get --enforce-lockfile
          flutter build web --release --no-web-resources-cdn \
            --dart-define=SUPABASE_URL="${{ steps.target.outputs.api_url }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          rm -rf "$RUNNER_TEMP/staff-web-$TARGET"
          cp -R build/web "$RUNNER_TEMP/staff-web-$TARGET"

      - name: Bundle carries only URL + publishable key
        run: node tools/ci/scan-secrets.mjs --bundle "$RUNNER_TEMP/staff-web-$TARGET"

      - name: Seal the artifact (SHA-256 per file + manifest)
        run: |
          node tools/ci/package-web.mjs seal "$RUNNER_TEMP/staff-web-$TARGET" \
            --env "$TARGET" --commit "$GITHUB_SHA" --api-url "${{ steps.target.outputs.api_url }}"
          cat "$RUNNER_TEMP/staff-web-$TARGET.manifest.json"

      - name: Upload immutable artifact
        uses: actions/upload-artifact@v4
        with:
          name: staff-web-${{ inputs.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/staff-web-${{ inputs.target }}
            ${{ runner.temp }}/staff-web-${{ inputs.target }}.SHA256SUMS
            ${{ runner.temp }}/staff-web-${{ inputs.target }}.manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: Deploy the verified artifact to the static host (when the owner has configured it)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          dir="$RUNNER_TEMP/staff-web-$TARGET"
          node tools/ci/package-web.mjs verify "$dir" --env "$TARGET" --commit "$GITHUB_SHA"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PAGES_PROJECT" ]; then
            echo "::notice title=Static host not configured::Artifact staff-web-$TARGET-$GITHUB_SHA is the deliverable; deploy it by hand or add the hosting secrets (docs/runbooks/environments-and-promotion.md)."
            exit 0
          fi
          branch=$(node tools/env/environments.mjs get "$TARGET" deploy.web_hosting.branch)
          npx --yes wrangler@4 pages deploy "$dir" --project-name "$PAGES_PROJECT" \
            --branch "$branch" --commit-hash "$GITHUB_SHA" --commit-dirty=false
