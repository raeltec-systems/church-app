[[entry]]
id = 1
type = "story"
title = "Record a historical meeting register through staff and mobile"
description = "Deliver CAP-8's first usable register by reviewing attendance access, deletion and the high-uncertainty report-care boundary with the owner at the first planning checkpoint, then letting a scoped leader or assistant open an existing meeting from normal staff and mobile navigation, record its held status through Cells, save Present, Absent, Excused or Unrecorded against the roster applicable to its effective start, and reopen the same server records on the other client with current-access and lifecycle protections already registered."
verify = "Using isolated fictional fixtures, record a held meeting containing accountless and later-transferred members, keep later joiners out of its historical roster, save a partly completed register on staff web and reopen it on mobile, then prove cancelled, not-held and unrecorded meeting facts remain distinct, cross-cell and ungranted reads fail, logout clears protected state, and no attendance is inferred from a duty response or Cannot attend notice."
covers = ["CAP-8"]
after = ["2.3", "2.6", "2.10", "2.11", "4.16", "5.1", "5.8", "5.9"]
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
unknown = "Q4 attendance retention and reader boundaries, Q6 accountable operators, corrected-time roster treatment and the proposed report-care authority/lifecycle contract need early review before affected behavior; the private-report implementation follows stable attendance/visitor contracts in entry 7, while fictional proof may proceed only where unresolved policy cannot change its result."
external_check = "An independent reviewer checks the historical-roster query, authority and lifecycle hooks and denied direct API reads, then observes the real staff-to-mobile persistence journey beyond the story's own tests."
references = ["_bmad-output/initiative-church-app/spec-church-app/functional-requirements.md#cell-groups", "_bmad-output/initiative-church-app/spec-church-app/design-contract.md#staff-screens-and-flows", "supabase/migrations/20261028130727_cells_record_roster.sql", "supabase/migrations/20261015190139_duties_owner_decisions.sql", "docs/runbooks/identity-access.md", "docs/runbooks/contracts-and-owner-seams.md#cells-meeting-reference-story-58"]

