verify = "With a SYNTHETIC Cells-like caller, create, revise and cancel a cell-owned position in one transaction, link a department duty and show it unchanged and still managed only by its department, flag and clear a mismatch, and show that a cell leader cannot edit the department duty, a second link for the same part/position is refused, and the fixtures pass in SQL, Dart and TypeScript."
covers = ["D11", "D1"]
after = [4, 6, 8]
hitl = false
risk = "high"
unknown = "Epic 5 is the first real caller; any shape it needs beyond these operations is a contract change recorded here rather than a Cells-side workaround."
references = ["_bmad-output/initiative-church-app/architecture-church-app/architecture-church-app.md#ad-6--one-revisioned-assignment-engine-adopted", "_bmad-output/initiative-church-app/architecture-church-app/architecture-church-app.md#ad-18--contract-first-integration-and-release-gates-adopted", "docs/runbooks/contracts-and-owner-seams.md"]

