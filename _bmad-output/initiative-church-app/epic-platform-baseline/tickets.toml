# Whole opening-epic plan; entries remain planned until a build writes its plan.
# Later epics retain envelopes. Unknowns are gates, not silently selected values.

[[entry]]
id = 1
type = "story"
title = "Run the mobile and trial-web tracer through Supabase"
description = "Using owner-provided or already authorized isolated project access, create the official locked Flutter scaffold, minimum CI smoke check and Supabase API migration so a native app and disposable Flutter Web trial display the same synthetic database-backed platform status through an allowlisted read with loading, retry and failure states."
verify = "From a clean checkout and CI smoke run, launch one native target and the web trial, change the synthetic platform status in the backend, and observe the same real API result and a recoverable network failure on both clients."
covers = ["P1"]
after = []
hitl = true
risk = "high"
unknown = "An owner must supply or approve isolated Supabase project access and available native test hardware or simulator; no live personal data or production provider selection is required."
references = ["_bmad-output/initiative-church-app/architecture-church-app/architecture-church-app.md#stack", "_bmad-output/initiative-church-app/architecture-church-app/architecture-church-app.md#structural-seed"]
external_check = "Entry 12 repeats the clean-checkout cross-client tracer independently of this story's smoke check."

[[entry]]
id = 2
type = "story"
title = "Prove password-session trust and no-SMS provider behavior"
description = "Build and retain a synthetic-account provider harness in a dedicated isolated Auth test project that demonstrates native phone/password signup and login, optional same-account verified email, password AMR and live-session checks, neutral recovery responses, private-data denial for OTP/magic-link/recovery-only sessions and native password-change session invalidation with no SMS configuration using owner-approved test inboxes and redirects."
verify = "Run the harness against the actual isolated Auth version and capture private-data denial for non-password sessions, permitted same-account email verification/reset and verified-email/password alias behavior under the same access gate, fresh-password-login requirements and old-session denial without any SMS delivery path."
covers = ["P2"]
after = [1]
hitl = true
risk = "high"
unknown = "Actual Auth claim, session-revocation and email/redirect behavior must be observed using approved test inboxes and recorded provider configuration; a failed assumption blocks its identity implementation rather than being waived."
references = ["_bmad-output/initiative-church-app/architecture-church-app/architecture-church-app.md#ad-3--person-identity-and-live-account-trust-adopted", "_bmad-output/initiative-church-app/architecture-church-app/architecture-church-app.md#ad-20--phonepassword-with-optional-verified-email-recovery-no-sms-adopted", "_bmad-output/initiative-church-app/spec-church-app/acceptance-map.md#auth-verification-detail"]
external_check = "Israel reviews captured provider evidence and an independent security reviewer challenges alternate Auth routes before production private-access implementation consumes the result."

[[entry]]
id = 3
type = "story"
title = "Prove fenced staff recovery across the Auth boundary"
description = "Extend the isolated provider harness to prove trusted native credential-change detection, generation-bound single-use grants and one privileged reset in flight, including superseded grants, cross-member attempts, relinking blocks and uncertain or late external Auth outcomes and present the independent security evidence for owner acceptance."
verify = "Run adversarial concurrent-reset and direct-change scenarios against real Auth plus injected transport uncertainty and demonstrate that old grants cannot mutate a newer binding, unresolved work blocks relinking, holds remain effective and no password or usable grant enters staff output or logs."
covers = ["P3"]
after = [2]
hitl = true
risk = "high"
unknown = "The trusted provider-change detection and dispatch/completion fence must be proved before assisted recovery is enabled, and failure requires a recorded architecture decision rather than a custom password store or weaker identity check."
references = ["_bmad-output/initiative-church-app/architecture-church-app/architecture-church-app.md#ad-20--phonepassword-with-optional-verified-email-recovery-no-sms-adopted", "_bmad-output/initiative-church-app/spec-church-app/acceptance-map.md#auth-verification-detail"]
external_check = "An independent security review repeats an unused-grant/direct-password-change case and an uncertain-reset/relink race, with Israel approving the evidence before the identity epic starts assisted-reset implementation."

