# Whole public content and giving epic plan; entries remain planned until a build writes its plan.
# Table order is build order; ids are stable. Requirement ids K1–K17 live in the epic's Requirements.
# Off production all content is SYNTHETIC or public domain and every giving method is a labelled SAMPLE
# (owner-decisions-milestone-1.md); Q3 and Q5 gate production publication until Israel approves them.

[[entry]]
id = 1
type = "story"
title = "Publish an event on staff web and read it as a guest on the mobile Calendar"
description = "Add the Content owner module's shared publication lifecycle (private drafts, immutable published revisions with the current one live until a replacement is published, withdraw and archive, attributed audit, editor authority for Media, Pastor and Admin from 2.3) and Content's one registered deletion handler that anonymises editor attribution and runs the per-kind erase parts later entries add to it, the first unauthenticated public read contract exposing only the current published projection (both reused by every later content kind), events with title, description, church-time start and end and location, the staff web Content area with an Events editor and accessible list, and the mobile public shell where guests and Pending applicants get the Home and Calendar tabs without signing in and members get the same tabs with My duties, My follow-ups and My cell kept on Home cards and the Account menu, with Home moved into its own presentation file."
verify = "On staging, a Media member drafts and publishes a two-day `SYNTHETIC Harvest Thanksgiving` event on staff web, a signed-out phone sees it on the Calendar with both endpoints, an edited draft leaves the published version live until it is republished, withdrawal removes it on refresh, and the API shows anonymous and Pending callers no draft, editor identity or private field while a plain member is refused every editor command, no client role can write a Content table and a deleted editor's attribution reads as a former member."
covers = ["K1", "K5", "K12", "K17"]
after = ["1.7", "2.11"]
hitl = false
risk = "high"
unknown = "Whether public reads use `security_invoker` views with an anonymous policy (the 1.1 `platform_status` pattern) or audited read functions is decided at build within AD-2; moving Duties and My cell off the tab bar is an agent assumption in the epic Notes that Israel may reverse."
references = ["_bmad-output/initiative-church-app/architecture-church-app/architecture-church-app.md#ad-2--one-transactional-command-and-read-contract-assumption", "_bmad-output/initiative-church-app/architecture-church-app/architecture-church-app.md#ad-15--public-giving-and-optional-chat-stay-isolated-adopted", "_bmad-output/initiative-church-app/spec-church-app/functional-requirements.md#roles-and-permissions", "_bmad-output/initiative-church-app/spec-church-app/design-contract.md#mobile-screen-and-flow-obligations", "docs/design-handoff/screenshots/app-14-calendar.png", "docs/runbooks/contracts-and-owner-seams.md", "docs/runbooks/client-shells.md"]
external_check = "An independent reviewer repeats the anonymous, Pending and plain-member read and command matrix (drafts, withdrawn items, editor identity, direct table access) before entry 17."

