[[entry]]
id = 4
type = "story"
title = "Keep published public content readable offline with honest saved and withdrawn states"
description = "Add one mobile public-content cache adapter, the only new persistence that `boundaries_test.dart` allows, that stores only allowlisted public reads whose projection marks them offline-allowed (church-authored, or rights cleared for offline use) with their publication and rights revision, caches poster and banner images under the same offline-allowed rule, shows a saved or offline label with the last update time, refreshes on reconnect and removes withdrawn or hidden items and their files, and apply it to the Calendar and the Home carousel, with entries 5, 6, 7 and 9 adding their own reads to the allowlist, while protected records stay in session memory."
verify = "On an emulator against staging, load the Calendar and Home, go offline and see both with the saved label, withdraw an event and a banner on staff web, reconnect and see both gone with their images evicted, and show by test that the cache refuses a read outside its allowlist or one not marked offline-allowed and that signing out leaves only public entries."
covers = ["K4"]
after = [2]
hitl = false
risk = "medium"
unknown = "The storage format and package (files under path_provider or an embedded database) are chosen and pinned at build; staff web keeps no persistent cache; whether a display-only item may sit in a short-lived cache is a Q5 question in the epic Notes, and until answered it is shown online only."
references = ["_bmad-output/initiative-church-app/architecture-church-app/architecture-church-app.md#ad-13--public-caching-private-session-state-and-file-gates-assumption", "_bmad-output/initiative-church-app/architecture-church-app/architecture-church-app.md#ad-16--shared-client-contract-and-accessible-surfaces-assumption", "packages/client_core/test/boundaries_test.dart"]

