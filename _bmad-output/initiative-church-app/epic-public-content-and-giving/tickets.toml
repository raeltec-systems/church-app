verify = "On staging, upload a `SYNTHETIC Theme 2026` image and a campaign image, see an oversized file and a disguised file type refused, publish both and see the carousel on a signed-out phone, and show through the API and Storage that a draft, an uncleared and a withdrawn file cannot be fetched by anonymous or member callers and that a third-party source missing from the q5 fixture value cannot be published."
