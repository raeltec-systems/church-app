publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  church_client_core:
    path: ../../packages/client_core
  church_design_system:
    path: ../../packages/design_system
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  supabase_flutter: 2.18.0

dev_dependencies:
