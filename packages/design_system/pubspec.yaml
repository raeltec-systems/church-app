name: church_design_system
description: Semantic design tokens, themes and accessible primitives shared by the BIC Kafue mobile and staff clients (design-contract.md, AD-16).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/bic-logo.png
    - assets/bic-logo-white.png
  # Design handoff fonts (SIL Open Font License 1.1; licences in fonts/).
  fonts:
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: fonts/Outfit-Bold.ttf
          weight: 700
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-Regular.ttf
          weight: 400
        - asset: fonts/Figtree-Medium.ttf
          weight: 500
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: fonts/Figtree-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
